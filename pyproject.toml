[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-ashare"
version = "0.1.0"
description = "Reproducible A-share screening, evidence-based AI research and paper portfolios"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<2.4", "pydantic>=2.10,<3",
  "pyarrow>=16,<24", "httpx>=0.27,<1", "openai>=1.55,<4",
  "python-dotenv>=1,<2", "ollama>=0.6,<1", "streamlit>=1.40,<2",
  "akshare>=1.17,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
finsight = "finsight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
