name: FinSight checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check src/finsight tests/finsight
      - run: python -m pytest -q
      - run: finsight --data-dir /tmp/finsight-smoke demo
